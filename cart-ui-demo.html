<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蜂云 · 购物车改版 Demo</title>
  <style>
    :root{--blue:#1769e0;--blue2:#eef5ff;--ink:#10233f;--muted:#71809a;--line:#e6ebf3;--bg:#f5f7fb;--green:#22a06b;--danger:#db4d58;--shadow:0 12px 35px rgba(28,51,84,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
    button,input{font:inherit} button{cursor:pointer;border:0}.app{min-height:100vh;display:grid;grid-template-columns:236px 1fr}
    aside{background:#fff;border-right:1px solid var(--line);padding:24px 14px}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 28px;color:var(--blue);font-size:19px;font-weight:800}.mark{width:28px;height:28px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px}.nav{display:grid;gap:6px}.nav a{padding:13px 14px;border-radius:10px;color:#52627a;text-decoration:none;font-size:14px;display:flex;justify-content:space-between}.nav a.active{background:var(--blue2);color:var(--blue);font-weight:700}.count{font-size:11px;padding:2px 7px;border-radius:9px;background:#e9515b;color:white} main{padding:28px 34px 120px;max-width:1540px;width:100%;margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}.crumb{color:#8a98ad;font-size:13px;margin-bottom:8px}h1{margin:0;font-size:26px;letter-spacing:-.5px}.sub{margin:8px 0 0;color:var(--muted);font-size:14px}.avatar{display:flex;align-items:center;gap:10px;color:#53627a;font-size:13px}.dot{width:9px;height:9px;background:#37b979;border-radius:50%;box-shadow:0 0 0 4px #e7f8ef}.notice{display:flex;gap:12px;background:#f0f6ff;border:1px solid #dceaff;border-radius:13px;padding:15px 17px;color:#53719c;font-size:13px;line-height:1.7;margin-bottom:18px}.notice b{color:#2c65a8}.notice .info{color:#1769e0;font-size:18px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.toolbar strong{font-size:17px}.toolbar span{color:var(--muted);font-size:13px;margin-left:9px}.actions{display:flex;gap:9px}.ghost{background:white;border:1px solid var(--line);color:#52627a;border-radius:8px;padding:9px 12px;font-size:13px}.clear{color:var(--danger);border-color:#ffd5d8}.cart{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.head,.item{display:grid;grid-template-columns:minmax(270px,2.2fr) minmax(170px,1.25fr) 135px 148px 178px 94px 32px;gap:15px;align-items:center;padding:0 24px}.head{height:48px;background:#fbfcfe;color:#7b8ba3;font-size:12px;font-weight:700;border-bottom:1px solid var(--line)}.item{min-height:116px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.product{display:flex;gap:13px;align-items:center}.icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#e5efff,#f1e8ff);display:grid;place-items:center;color:#426cc9;font-size:19px}.pname{font-weight:700;font-size:14px}.meta{color:#8795ab;font-size:12px;margin-top:6px}.label{display:none}.client,input{width:100%;border:1px solid #dce3ee;border-radius:8px;padding:9px 10px;color:#243a5a;background:white;font-size:13px}.price{font-weight:700;font-size:14px}.price small{font-weight:400;color:#8190a8;display:block;font-size:11px;margin-top:5px}.quantity{display:flex;width:max-content;border:1px solid #dce3ee;border-radius:8px;overflow:hidden}.quantity button{width:31px;background:#f7f9fc;color:#547098;font-size:18px}.quantity input{border:0;border-left:1px solid #e5eaf2;border-right:1px solid #e5eaf2;width:42px;border-radius:0;text-align:center;padding:8px 2px}.amount input{font-weight:700}.period{display:flex;gap:6px}.period input{min-width:0}.subtotal{font-weight:800;color:#18345d;font-size:15px}.remove{background:transparent;color:#a3afbf;font-size:19px}.remove:hover{color:var(--danger)}.checkout{position:fixed;left:calc(50% - 652px);bottom:22px;width:min(calc(100% - 300px),1304px);background:#112d54;color:#fff;border-radius:15px;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 35px rgba(16,35,63,.24)}.summary{display:flex;gap:22px;align-items:center}.summary .small{color:#c4d4ea;font-size:13px}.total{font-size:24px;font-weight:800}.total small{font-size:12px;font-weight:400;color:#c4d4ea;margin-right:8px}.checkout button{background:#2a81ff;color:#fff;padding:12px 22px;border-radius:9px;font-weight:700;box-shadow:0 5px 13px rgba(42,129,255,.35)}
    @media(max-width:1100px){.app{grid-template-columns:1fr}aside{display:none}main{padding:22px 20px 112px}.head{display:none}.item{grid-template-columns:1fr 1fr;padding:18px;gap:13px}.product{grid-column:1/-1}.label{display:block;color:#8997ab;font-size:11px;margin-bottom:5px}.checkout{left:20px;width:calc(100% - 40px)}}@media(max-width:620px){.top{display:block}.avatar{margin-top:16px}.item{grid-template-columns:1fr}.product{grid-column:auto}.checkout{padding:13px}.summary{gap:10px}.total{font-size:19px}.checkout button{padding:11px 14px}.notice{font-size:12px}.period{display:block}.period input{margin-bottom:5px}}
  </style>
</head>
<body>
<div class="app">
  <aside><div class="brand"><div class="mark">∞</div>蜂云产品服务平台</div><nav class="nav"><a href="#">▦　产品及服务 <span>⌄</span></a><a href="#">▰　销售项目</a><a class="active" href="#">🛒　购物车 <span class="count" id="sideCount">4</span></a></nav></aside>
  <main>
    <header class="top"><div><div class="crumb">销售管理 / 购物车</div><h1>购物车</h1><p class="sub">确认客户、金额与服务期限后，即可创建销售项目。</p></div><div class="avatar"><span class="dot"></span>系统运行中　 刘尚坤</div></header>
    <section class="notice"><div class="info">ⓘ</div><div><b>下单前请完善关键信息</b><br>每个产品需填写客户；销售金额留空时按挂牌价结算。数量受到可用库存限制，提交后将创建待审核销售项目。</div></section>
    <div class="toolbar"><div><strong>待售产品</strong><span id="itemCount">4 个产品</span></div><div class="actions"><button class="ghost">导出清单</button><button class="ghost clear" id="clear">清空购物车</button></div></div>
    <section class="cart"><div class="head"><div>产品信息</div><div>客户</div><div>挂牌单价</div><div>数量</div><div>销售金额（元）</div><div>服务期限</div><div>小计</div><div></div></div><div id="list"></div></section>
  </main>
</div>
<div class="checkout"><div class="summary"><div class="small">已选 <b id="selected">4</b> 件产品</div><div class="total"><small>应付合计</small>¥<span id="total">3,010.00</span></div></div><button onclick="alert('Demo：已进入创建销售项目流程')">创建销售项目　→</button></div>
<script>
const products=[
 {name:'电磁数据处理软件',code:'CH-SW-006',org:'蜂云星座',price:'5,100,000.00',sale:10,start:'2026-10-20',end:'2026-10-22',icon:'◈'},
 {name:'青牛企业大数据分析平台 V1.0',code:'CH-SW-005',org:'安徽天枢',price:'5,661,000.00',sale:1000,start:'',end:'',icon:'◫'},
 {name:'大语言知识模型服务系统',code:'CH-SW-004',org:'安徽天枢',price:'3,160,000.00',sale:1000,start:'',end:'',icon:'✦'},
 {name:'面向具身智能的三维物体生成系统',code:'CH-SW-003',org:'安徽天枢',price:'5,582,500.00',sale:1000,start:'',end:'',icon:'◇'}];
const list=document.querySelector('#list');
function money(n){return Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){list.innerHTML='';products.forEach((p,i)=>{const e=document.createElement('div');e.className='item';e.innerHTML=`<div class="product"><div class="icon">${p.icon}</div><div><div class="pname">${p.name}</div><div class="meta">${p.code} · 软件 · ${p.org}</div></div></div><div><div class="label">客户</div><input class="client" placeholder="填写客户名称" aria-label="客户" /></div><div><div class="label">挂牌单价</div><div class="price">¥${p.price}<small>库存上限 1</small></div></div><div><div class="label">数量</div><div class="quantity"><button data-i="${i}" data-d="-1">−</button><input value="${p.qty||1}" readonly><button data-i="${i}" data-d="1">＋</button></div></div><div class="amount"><div class="label">销售金额（元）</div><input type="number" value="${p.sale}" data-sale="${i}" /></div><div class="period"><div><div class="label">开始</div><input type="date" value="${p.start}"></div><div><div class="label">结束</div><input type="date" value="${p.end}"></div></div><div><div class="label">小计</div><div class="subtotal">¥${money(p.sale*(p.qty||1))}</div></div><button class="remove" data-remove="${i}" title="移除">×</button>`;list.appendChild(e)});bind();sum()}
function bind(){document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const p=products[b.dataset.i];p.qty=Math.max(1,Math.min(9,(p.qty||1)+Number(b.dataset.d)));render()});document.querySelectorAll('[data-sale]').forEach(x=>x.oninput=()=>{products[x.dataset.sale].sale=Number(x.value);sum()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{products.splice(b.dataset.remove,1);render()})}
function sum(){const n=products.reduce((s,p)=>s+p.sale*(p.qty||1),0);document.querySelector('#total').textContent=money(n);document.querySelector('#selected').textContent=products.length;document.querySelector('#itemCount').textContent=products.length+' 个产品';document.querySelector('#sideCount').textContent=products.length}
document.querySelector('#clear').onclick=()=>{if(confirm('确定清空演示购物车吗？')){products.splice(0);render()}};render();
</script>
</body></html>
